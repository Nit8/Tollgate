# ─────────────────────────────────────────────────────────────
#  Tollgate Server — nginx reverse proxy + HTTPS termination
#
#  Install:
#      sudo cp deploy/nginx/tollgate.conf /etc/nginx/sites-available/
#      sudo ln -s /etc/nginx/sites-available/tollgate.conf /etc/nginx/sites-enabled/
#      sudo certbot --nginx -d license.yourapp.com
#      sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# Rate limit zone — 10 requests/sec per IP
limit_req_zone $binary_remote_addr zone=tollgate_limit:10m rate=10r/s;

upstream tollgate_backend {
    server 127.0.0.1:7431;
    keepalive 32;
}

server {
    listen 80;
    server_name license.yourapp.com;

    # Certbot will rewrite this to listen 443 ssl when you run --nginx
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name license.yourapp.com;

    # TLS certs — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/license.yourapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.yourapp.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 64k;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options "DENY"            always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header Referrer-Policy "no-referrer"      always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate limit ───────────────────────────────────────────
    limit_req zone=tollgate_limit burst=20 nodelay;

    # ── Swagger UI — restrict to internal/admin (recommended) ──
    # location /swagger {
    #     allow 10.0.0.0/8;
    #     allow 192.168.0.0/16;
    #     deny all;
    #     proxy_pass http://tollgate_backend;
    # }

    # ── Proxy to Kestrel ─────────────────────────────────────
    location / {
        proxy_pass         http://tollgate_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";

        proxy_connect_timeout  10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;
    }
}
